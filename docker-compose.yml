services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:5000/api

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@database:5432/bolivianmarket
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_dummy_para_desarrollo}
      - JWT_SECRET=${JWT_SECRET:-cambiar_en_produccion}
      - JWT_EXPIRE=7d
      - SUPERADMIN_EMAIL=${SUPERADMIN_EMAIL:-superadmin@bolivianmarket.com}
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD:-superadmin123}

  database:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=bolivianmarket
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
